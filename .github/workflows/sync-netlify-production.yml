name: Sync Netlify production branch

on:
  push:
    branches: [v2]

permissions:
  contents: write

concurrency:
  group: sync-netlify-production
  cancel-in-progress: true

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Netlify production branch
        run: git push origin HEAD:main
